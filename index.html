
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primer Git</title>

    <style>
        body {
            background-color: #eaf2f8;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #24292e;
            color: white;
            padding: 30px;
        }

        h1 {
            font-size: 36px;
        }

        main {
            padding: 40px 20px;
        }

        p {
            font-size: 18px;
            color: #333;
        }

        .boton {
            display: inline-block;
            background-color: #2ea44f;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 15px;
        }

        .boton:hover {
            background-color: #22863a;
        }

        footer {
            background-color: #24292e;
            color: white;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>¡Mi primer Git!</h1>
        <p>Mi primera página web utilizando Git y GitHub</p>
    </header>

    <main>
        <h2>Bienvenidos a mi página web</h2>

        <p>
            Estoy aprendiendo a crear páginas web
            utilizando HTML, CSS, Git y GitHub.
        </p>

        <p>
            Este es mi primer proyecto y el comienzo
            de mi aprendizaje en programación.
        </p>

        <a class="boton" href="https://github.com/" target="_blank">
            Visitar GitHub
        </a>
    </main>

    <footer>
        <p>Creado por mí | 2026</p>
    </footer>

</body>
</html>
